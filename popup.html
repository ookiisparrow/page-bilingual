<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>双语网页</title>
    <style>
      body { margin: 0; font: 13px/1.4 ui-sans-serif, system-ui, sans-serif; color: #000; width: 260px; }
      header { font-weight: 700; padding: 12px 14px 6px; }
      .pad { padding: 0 14px 14px; }
      button { font: inherit; border-radius: 8px; border: 1px solid #000; background: #fff; padding: 9px 10px; cursor: pointer; width: 100%; }
      button.primary { background: #000; color: #fff; border-color: #000; font-weight: 650; }
      #status { margin-top: 10px; font-size: 12px; color: #333; min-height: 1.2em; }
      #status.err { color: #000; font-weight: 650; }
      footer { padding: 8px 14px 12px; border-top: 1px solid #d4d4d4; }
      footer a { color: #000; text-decoration: underline; font-size: 12px; }
      .hint { margin-top: 8px; font-size: 11px; color: #444; }
    </style>
  </head>
  <body>
    <header>双语网页</header>
    <div class="pad">
      <button class="primary" id="toggle">翻译本页</button>
      <p class="hint">页内唯一浮钮：译 ↔ 原（整页替换）。</p>
      <div id="status"></div>
    </div>
    <footer><a href="#" id="opts">选项</a></footer>
    <script src="shared.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
